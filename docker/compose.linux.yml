# Linux overlay: also runs the voice server in a sibling container with
# GPU access. Both containers share the host network, so localhost:8765
# "just works" from the webapp.
services:
  voice:
    build:
      context: ..
      dockerfile: docker/Dockerfile.voice.linux
    env_file: ../.env
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  webapp:
    depends_on:
      - voice
