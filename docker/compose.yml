# Single-service compose: the FastAPI webapp that bridges the browser to
# Deepgram's Voice Agent API. Deepgram is reached over the public internet,
# so no special networking (host mode, sibling containers, etc.) is needed.
services:
  webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.webapp
    env_file: ../.env
    ports:
      - "8000:8000"
    # Mirror runtime logs onto the host so `tail -f logs/…` works from the repo root.
    volumes:
      - ../logs:/app/logs
